<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="folderRear" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#404040"/><stop offset=".43" stop-color="#292929"/><stop offset="1" stop-color="#191919"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030"/><stop offset=".09" stop-color="#232323"/><stop offset=".55" stop-color="#1B1B1B"/><stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="folderRim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777"/><stop offset=".18" stop-color="#484848"/><stop offset=".65" stop-color="#292929"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <clipPath id="folderInterior"><path d="M9 43C9 33 16 27 28 27H172C184 27 191 33 191 44V174Q191 188 177 188H23Q9 188 9 174Z"/></clipPath>
    <!-- Reuse the exact artwork from kit-case-3d-v1.svg for all three boxes. -->

    <linearGradient id="body" x1="111" y1="63" x2="111" y2="167" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252525"/><stop offset=".25" stop-color="#1D1D1D"/>
      <stop offset=".88" stop-color="#141414"/><stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="side" x1="24" y1="100" x2="216" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505" stop-opacity=".65"/><stop offset=".12" stop-color="#fff" stop-opacity=".035"/>
      <stop offset=".26" stop-color="#fff" stop-opacity=".04"/><stop offset=".77" stop-color="#fff" stop-opacity=".015"/>
      <stop offset="1" stop-color="#000" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="lid" x1="120" y1="34" x2="120" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#505050"/><stop offset=".15" stop-color="#373737"/><stop offset=".46" stop-color="#242424"/>
      <stop offset=".69" stop-color="#161616"/><stop offset=".72" stop-color="#393939"/>
      <stop offset=".86" stop-color="#1E1E1E"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#161616"/><stop offset=".2" stop-color="#393939"/><stop offset=".48" stop-color="#303030"/>
      <stop offset=".75" stop-color="#242424"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="strapTop" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#505050"/><stop offset=".3" stop-color="#353535"/>
      <stop offset=".85" stop-color="#252525"/><stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="orange" x1="120" y1="12" x2="120" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB53F"/><stop offset=".25" stop-color="#FF8400"/>
      <stop offset=".58" stop-color="#FF6900"/><stop offset="1" stop-color="#DA3F00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="contact" x="-75%" y="-15%" width="250%" height="135%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <symbol id="existingKit" viewBox="10 5 220 178" overflow="visible">

  <ellipse cx="120" cy="170" rx="92" ry="9" fill="#000" opacity=".2" filter="url(#shadow)"/>
  <ellipse cx="120" cy="169" rx="79" ry="4" fill="#000" opacity=".22"/>
  <path d="M28 71H212V139Q212 164 188 168H52Q28 165 28 139Z" fill="url(#body)" stroke="#101010" stroke-width="1.25"/>
  <path d="M28 71H212V139Q212 164 188 168H52Q28 165 28 139Z" fill="url(#side)"/>
  <path d="M29 84H211V98H29Z" fill="#050505" opacity=".3"/>
  <!-- Rounded upper lid and raised rim -->
  <path d="M21 67C22 49 39 34 60 34H180C201 34 218 49 219 67V80Q219 89 209 91H31Q21 89 21 80Z" fill="url(#lid)" stroke="#151515" stroke-width="1.2"/>
  <path d="M25 62C29 44 43 37 61 37H179C197 37 211 44 215 62" stroke="#6C6C6C" stroke-opacity=".42" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M22 71C57 73 183 73 218 71" stroke="#7A7A7A" stroke-opacity=".48" stroke-width="1.5"/>
  <path d="M23 86C58 88 182 88 217 86" stroke="#0D0D0D" stroke-width="2"/>
  <!-- Raised black retaining bands, with separate top shoulder and contact shadows -->
  <path d="M76 38H98L95 167H74Z M144 38H166L167 167H146Z" fill="#000" opacity=".38" filter="url(#contact)"/>
  <path d="M75 76H92V161Q92 168 87 169H79Q74 168 74 162Z" fill="url(#strap)" stroke="#111" stroke-width=".8"/>
  <path d="M148 76H165L166 161Q166 168 161 169H153Q148 168 148 162Z" fill="url(#strap)" stroke="#111" stroke-width=".8"/>
  <path d="M75 36H92V76Q84 79 75 76Z" fill="url(#strapTop)" stroke="#242424" stroke-width=".85"/>
  <path d="M148 36H165V76Q157 79 148 76Z" fill="url(#strapTop)" stroke="#242424" stroke-width=".85"/>
  <path d="M77 80V161 M150 80V161" stroke="#666" stroke-opacity=".16" stroke-width="1" stroke-linecap="round"/>
  <!-- Orange carry handle; the dark straps, lid and case body remain black. -->
  <path d="M83 42V29C83 20 89 14 98 14H142C151 14 157 20 157 29V42" stroke="#C34900" stroke-width="13" stroke-linecap="round"/>
  <path d="M83 40V29C83 20 89 14 98 14H142C151 14 157 20 157 29V40" stroke="url(#orange)" stroke-width="10" stroke-linecap="round"/>
  <path d="M79 29C79 18 87 9 98 9H142C153 9 161 18 161 29" stroke="#FFD077" stroke-opacity=".72" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M89 29C89 23 93 20 99 20H141C147 20 151 23 151 29" stroke="#FFB34A" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M78 43V37M162 43V37" stroke="#FF7A00" stroke-opacity=".65" stroke-width="1.3" stroke-linecap="round"/>

    </symbol>
  </defs>
  <!-- Rear folder: a real raised left tab, with a rounded descending shoulder. -->
  <path d="M3 26C3 12 12 3 25 3H61C71 3 76 6 84 15C89 20 94 21 103 21H173C188 21 197 31 197 46V174C197 188 187 197 173 197H27C13 197 3 187 3 174Z" fill="url(#folderRear)" stroke="#151515" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M5 27C5 13 13 5 26 5H61C70 5 76 9 83 17C89 23 95 23 103 23H173C186 23 194 31 195 45" stroke="#626262" stroke-width="1.6" stroke-linecap="round"/>
  <!-- The visible lining behind the kit boxes is solid white, even in dark mode. -->
  <path d="M9 43C9 33 16 27 28 27H172C184 27 191 33 191 44V174Q191 188 177 188H23Q9 188 9 174Z" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <g clip-path="url(#folderInterior)">
    <!-- Two rear cases and a larger center case in front. All handles remain distinct. -->
    <use href="#existingKit" x="11" y="35" width="76" height="62"/>
    <use href="#existingKit" x="113" y="35" width="76" height="62"/>
    <use href="#existingKit" x="46" y="39" width="108" height="87.4"/>
  </g>
  <!-- Foreground pocket: hides the lower portion of the cases and has its own stepped tab. -->
  <path d="M3 91C3 81 11 75 24 75H75C87 75 92 81 101 89C108 96 115 98 125 98H176C190 98 197 107 197 120V174C197 188 187 197 173 197H27C13 197 3 187 3 174Z" fill="url(#folderFront)" stroke="#151515" stroke-width="3" stroke-linejoin="round"/>
  <path d="M5.5 91C5.5 83 12 77.5 24 77.5H75C86 77.5 91 83 99.5 91C107 98 114 100.5 125 100.5H176C188 100.5 194.5 108 194.5 120V174C194.5 186 186 194.5 173 194.5H27C14 194.5 5.5 186 5.5 174Z" stroke="url(#folderRim)" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M8 94C8 86 14 82 25 82H75C85 82 90 87 98 94C106 102 114 105 125 105H175C185 105 191.5 111 191.5 121" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1" stroke-linecap="round"/>
</svg>
