<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="folderRear" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#404040"/><stop offset=".43" stop-color="#292929"/><stop offset="1" stop-color="#191919"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#303030"/><stop offset=".09" stop-color="#232323"/><stop offset=".55" stop-color="#1B1B1B"/><stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="folderRim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777"/><stop offset=".18" stop-color="#484848"/><stop offset=".65" stop-color="#292929"/><stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <clipPath id="folderInterior"><path d="M9 43C9 33 16 27 28 27H172C184 27 191 33 191 44V174Q191 188 177 188H23Q9 188 9 174Z"/></clipPath>
    <linearGradient id="docEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#585858"/><stop offset=".14" stop-color="#303030"/><stop offset=".6" stop-color="#181818"/><stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="docPaper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F8F8F8"/><stop offset="1" stop-color="#E6E6E6"/>
    </linearGradient>
    <linearGradient id="docFold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#555"/><stop offset=".38" stop-color="#272727"/><stop offset="1" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="docOrange" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF9D39"/><stop offset=".38" stop-color="#FF780C"/><stop offset="1" stop-color="#E34A00"/>
    </linearGradient>
    <linearGradient id="docLine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C4C4C4"/><stop offset=".4" stop-color="#A5A5A5"/><stop offset="1" stop-color="#777"/>
    </linearGradient>
    <filter id="docShadow" x="-35%" y="-35%" width="175%" height="185%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <filter id="docLineShadow" x="-20%" y="-80%" width="140%" height="300%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <symbol id="proposalDoc" viewBox="10 -3 130 158" overflow="visible">
    <g filter="url(#docShadow)">
      <!-- Solid raised black document frame and inset white sheet. -->
      <path d="M38 7H94L130 43V127Q130 145 113 145H38Q20 145 20 127V26Q20 7 38 7Z" fill="#101010" stroke="#080808" stroke-width="2"/>
      <path d="M39 4H94L129 39V124Q129 141 112 141H39Q22 141 22 124V23Q22 4 39 4Z" fill="url(#docEdge)" stroke="#141414" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M39 7H93L126 40V124Q126 138 112 138H39Q25 138 25 124V23Q25 7 39 7Z" fill="none" stroke="#737373" stroke-opacity=".56" stroke-width="1.2"/>
      <path d="M39 11H90L123 44V123Q123 134 112 134H39Q29 134 29 123V23Q29 11 39 11Z" fill="url(#docPaper)" stroke="#1C1C1C" stroke-width="1.5"/>
      <path d="M32 23Q32 14 40 14H86" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".9"/>
      <!-- Folded triangle is black, not orange. -->
      <path d="M91 7L129 39H100Q91 39 91 30Z" fill="#0C0C0C" opacity=".38" transform="translate(0 2)"/>
      <path d="M94 4L129 39H102Q94 39 94 31Z" fill="url(#docFold)" stroke="#141414" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M97 8L125 36" stroke="#777" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Orange title stripe and three dimensional gray text strokes. -->
      <g filter="url(#docLineShadow)">
        <rect x="43" y="51" width="60" height="10" rx="5" fill="url(#docOrange)"/>
        <rect x="43" y="74" width="68" height="7" rx="3.5" fill="url(#docLine)"/>
        <rect x="43" y="89" width="68" height="7" rx="3.5" fill="url(#docLine)"/>
        <rect x="43" y="104" width="68" height="7" rx="3.5" fill="url(#docLine)"/>
      </g>
      <path d="M49 53H97" stroke="#FFBD78" stroke-opacity=".7" stroke-width="1" stroke-linecap="round"/>
    </g>
    </symbol>
  </defs>
  <!-- Rear folder: a real raised left tab, with a rounded descending shoulder. -->
  <path d="M3 26C3 12 12 3 25 3H61C71 3 76 6 84 15C89 20 94 21 103 21H173C188 21 197 31 197 46V174C197 188 187 197 173 197H27C13 197 3 187 3 174Z" fill="url(#folderRear)" stroke="#151515" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M5 27C5 13 13 5 26 5H61C70 5 76 9 83 17C89 23 95 23 103 23H173C186 23 194 31 195 45" stroke="#626262" stroke-width="1.6" stroke-linecap="round"/>
  <!-- The visible lining behind the proposal documents is solid white, even in dark mode. -->
  <path d="M9 43C9 33 16 27 28 27H172C184 27 191 33 191 44V174Q191 188 177 188H23Q9 188 9 174Z" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <g clip-path="url(#folderInterior)">
    <!-- Three distinct, slightly fanned proposal documents in the white-lined folder. -->
    <g transform="rotate(-13 51 75)">
      <use href="#proposalDoc" x="15" y="40" width="65" height="79"/>
    </g>
    <g transform="rotate(13 149 75)">
      <use href="#proposalDoc" x="120" y="40" width="65" height="79"/>
    </g>
    <use href="#proposalDoc" x="63" y="34" width="74" height="90"/>
  </g>
  <!-- Foreground pocket: hides the lower portion of the documents and has its own stepped tab. -->
  <path d="M3 91C3 81 11 75 24 75H75C87 75 92 81 101 89C108 96 115 98 125 98H176C190 98 197 107 197 120V174C197 188 187 197 173 197H27C13 197 3 187 3 174Z" fill="url(#folderFront)" stroke="#151515" stroke-width="3" stroke-linejoin="round"/>
  <path d="M5.5 91C5.5 83 12 77.5 24 77.5H75C86 77.5 91 83 99.5 91C107 98 114 100.5 125 100.5H176C188 100.5 194.5 108 194.5 120V174C194.5 186 186 194.5 173 194.5H27C14 194.5 5.5 186 5.5 174Z" stroke="url(#folderRim)" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M8 94C8 86 14 82 25 82H75C85 82 90 87 98 94C106 102 114 105 125 105H175C185 105 191.5 111 191.5 121" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1" stroke-linecap="round"/>
</svg>
