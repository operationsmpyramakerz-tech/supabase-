<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -3 130 158" fill="none">
  <defs>
    <linearGradient id="docEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#585858"/><stop offset=".14" stop-color="#303030"/><stop offset=".6" stop-color="#181818"/><stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="docPaper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F8F8F8"/><stop offset="1" stop-color="#E6E6E6"/>
    </linearGradient>
    <linearGradient id="docFold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#555"/><stop offset=".38" stop-color="#272727"/><stop offset="1" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="docOrange" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF9D39"/><stop offset=".38" stop-color="#FF780C"/><stop offset="1" stop-color="#E34A00"/>
    </linearGradient>
    <linearGradient id="docLine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C4C4C4"/><stop offset=".4" stop-color="#A5A5A5"/><stop offset="1" stop-color="#777"/>
    </linearGradient>
    <filter id="docShadow" x="-35%" y="-35%" width="175%" height="185%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <filter id="docLineShadow" x="-20%" y="-80%" width="140%" height="300%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
    <g filter="url(#docShadow)">
      <!-- Solid raised black document frame and inset white sheet. -->
      <path d="M38 7H94L130 43V127Q130 145 113 145H38Q20 145 20 127V26Q20 7 38 7Z" fill="#101010" stroke="#080808" stroke-width="2"/>
      <path d="M39 4H94L129 39V124Q129 141 112 141H39Q22 141 22 124V23Q22 4 39 4Z" fill="url(#docEdge)" stroke="#141414" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M39 7H93L126 40V124Q126 138 112 138H39Q25 138 25 124V23Q25 7 39 7Z" fill="none" stroke="#737373" stroke-opacity=".56" stroke-width="1.2"/>
      <path d="M39 11H90L123 44V123Q123 134 112 134H39Q29 134 29 123V23Q29 11 39 11Z" fill="url(#docPaper)" stroke="#1C1C1C" stroke-width="1.5"/>
      <path d="M32 23Q32 14 40 14H86" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".9"/>
      <!-- Folded triangle is black, not orange. -->
      <path d="M91 7L129 39H100Q91 39 91 30Z" fill="#0C0C0C" opacity=".38" transform="translate(0 2)"/>
      <path d="M94 4L129 39H102Q94 39 94 31Z" fill="url(#docFold)" stroke="#141414" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M97 8L125 36" stroke="#777" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Orange title stripe and three dimensional gray text strokes. -->
      <g filter="url(#docLineShadow)">
        <rect x="43" y="51" width="60" height="10" rx="5" fill="url(#docOrange)"/>
        <rect x="43" y="74" width="68" height="7" rx="3.5" fill="url(#docLine)"/>
        <rect x="43" y="89" width="68" height="7" rx="3.5" fill="url(#docLine)"/>
        <rect x="43" y="104" width="68" height="7" rx="3.5" fill="url(#docLine)"/>
      </g>
      <path d="M49 53H97" stroke="#FFBD78" stroke-opacity=".7" stroke-width="1" stroke-linecap="round"/>
    </g>
</svg>
