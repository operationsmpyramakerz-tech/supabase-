<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <title>Operations Hub Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #071022;
    }
    .card {
      width: min(92vw, 460px);
      padding: 32px;
      border-radius: 28px;
      background: #fff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 24px 80px rgba(15,23,42,.12);
      text-align: center;
    }
    img { width: 70px; height: 70px; border-radius: 22px; margin-bottom: 16px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 22px; color: #667085; font-weight: 700; line-height: 1.5; }
    button {
      border: 0;
      border-radius: 16px;
      background: #071022;
      color: #fff;
      font-weight: 900;
      padding: 14px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="Operations Hub" />
    <h1>You are offline</h1>
    <p>Operations Hub is installed, but this page needs internet access to load live data.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
