<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>Opening Operations Hub</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, rgba(234, 112, 45, .16), transparent 35%), #fff;
      color: #071022;
    }
    .card {
      width: min(92vw, 460px);
      padding: 32px;
      border: 1px solid rgba(234, 112, 45, .22);
      border-radius: 28px;
      box-shadow: 0 24px 90px rgba(15, 23, 42, .12);
      background: rgba(255, 255, 255, .86);
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 22px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 18px; color: #667085; font-weight: 700; line-height: 1.5; }
    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(234,112,45,.18);
      border-top-color: #ea702d;
      border-radius: 50%;
      margin: 20px auto 0;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #c04f1b; font-weight: 800; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="Operations Hub" />
    <h1>Opening Operations Hub</h1>
    <p>Preparing the installed app experience...</p>
    <div class="loader" aria-hidden="true"></div>
    <noscript><p><a href="/home">Continue to Operations Hub</a></p></noscript>
  </main>
  <script src="/pwa-register.js"></script>
  <script>
    window.setTimeout(function () {
      window.location.replace('/home');
    }, 350);
  </script>
</body>
</html>
