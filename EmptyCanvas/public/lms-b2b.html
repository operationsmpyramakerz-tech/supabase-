    .b2b-admin-password-modal{

      display:flex;
    }

    .b2b-admin-password-modal__backdrop{
      position:absolute;
      inset:0;
      background:rgba(15,23,42,.58);
      backdrop-filter:blur(18px);
    }

    .b2b-admin-password-modal__dialog{
      position:relative;
      width:min(100%, 520px);

      border:1px solid rgba(15,23,42,.08);

      padding:28px;
      color:#0f172a;
    }

    .b2b-admin-password-modal__close{
      position:absolute;
      top:18px;
      right:18px;
      width:48px;
      height:48px;
      border-radius:16px;
      border:1px solid rgba(15,23,42,.08);
      background:#fff;
      display:grid;
      place-items:center;
      font-size:30px;
      line-height:1;
      font-weight:800;
      color:#0f172a;
      cursor:pointer;
    }

    .b2b-admin-password-modal__icon{
      width:64px;
      height:64px;
      display:grid;
      place-items:center;
      border-radius:22px;
      border:1px solid rgba(234,88,12,.14);
      background:#fff7ed;
      color:#c2410c;
      margin-bottom:18px;
    }

    .b2b-admin-password-modal__icon svg{
      width:28px;
      height:28px;
    }

    .b2b-admin-password-modal__copy span{
      display:block;
      margin-bottom:8px;
      color:#c2410c;
      font-size:.78rem;
      font-weight:950;
      letter-spacing:.1em;
    }

    .b2b-admin-password-modal__copy h3{
      margin:0;
      font-size:clamp(1.55rem, 3.5vw, 2.2rem);
      line-height:1.1;
      font-weight:950;
    }

    .b2b-admin-password-modal__copy p{
      margin:10px 0 22px;
      color:#64748b;
      font-weight:750;
      line-height:1.55;
    }

    .b2b-admin-password-modal__field{
      display:grid;
      gap:9px;
      font-weight:900;
      color:#475569;
      margin-bottom:12px;
    }

    .b2b-admin-password-modal__field input{
      width:100%;
      min-height:58px;
      border-radius:18px;
      border:1px solid rgba(15,23,42,.12);
      background:#fff;
      padding:0 18px;
      font:inherit;
      font-weight:850;
      color:#0f172a;
      outline:none;
    }

    .b2b-admin-password-modal__field input:focus{
      border-color:#fb923c;
      box-shadow:0 0 0 5px rgba(251,146,60,.16);
    }

    .b2b-admin-password-modal__error{
      min-height:22px;
      color:#dc2626;
      font-weight:800;
      margin-bottom:14px;
    }

    .b2b-admin-password-modal__actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .b2b-admin-password-modal__btn{
      min-height:56px;
      border-radius:18px;
      border:0;
      font-weight:950;
      cursor:pointer;
    }

    .b2b-admin-password-modal__btn--light{
      background:#fff;
      border:1px solid rgba(15,23,42,.08);
      color:#0f172a;
    }

    .b2b-admin-password-modal__btn--dark{
      background:#050914;
      color:#fff;
      box-shadow:0 18px 32px rgba(15,23,42,.2);
    }

    .b2b-admin-password-modal__btn:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

  <style>
    .b2b-wrap{

      margin: 0 auto;

      background: linear-gradient(180deg, #fbfbfb 0%, #f5f5f4 100%) !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .b2b-section-head{

      line-height: 1.55;
    }

    .b2b-grid{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 26px 24px;
      padding: 26px;
      align-items: start;
    }

    .school-folder{
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 228px;
      padding: 16px 14px 14px;
      text-decoration: none;
      background: #f1f1ef;
      border: 1px solid rgba(15, 23, 42, 0.04);
      border-radius: 18px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .school-folder:hover{
      transform: translateY(-4px);
      background: #ececea;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
    }

    .school-folder:focus-visible{
      outline: 3px solid rgba(249, 115, 22, 0.18);
      outline-offset: 2px;
    }

    .school-folder__figure{
      position: relative;
      width: 176px;
      height: 122px;
      margin-bottom: 16px;
      pointer-events: none;
    }

    .school-folder__paper{
      position: absolute;
      top: 6px;
      width: 76px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.1);
      border: 1px solid rgba(17, 24, 39, 0.05);
    }

    .school-folder__paper::before{
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      top: 12px;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.22);
      box-shadow:
        0 14px 0 rgba(148, 163, 184, 0.14),
        0 28px 0 rgba(148, 163, 184, 0.12);
    }

    .school-folder__paper--left{
      left: 22px;
      transform: rotate(-3deg);
    }

    .school-folder__paper--right{
      right: 22px;
      transform: rotate(4deg);
    }

    .school-folder__back{
      position: absolute;
      left: 30px;
      top: 16px;
      width: 126px;
      height: 76px;
      border-radius: 16px;
      background: linear-gradient(180deg, #777777 0%, #5f5f5f 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .school-folder__back::after{
      content: '';
      position: absolute;
      right: 20px;
      top: 0;
      width: 38px;
      height: 16px;
      border-bottom-left-radius: 16px;
      background: #f1f1ef;
      opacity: 0.95;
    }

    .school-folder__front{
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 156px;
      height: 86px;
      border-radius: 18px;
      background: linear-gradient(180deg, #707070 0%, #626262 100%);
      box-shadow:
        0 16px 24px rgba(15, 23, 42, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .school-folder__front::before{
      content: '';
      position: absolute;
      left: 0;
      top: -18px;
      width: 92px;
      height: 36px;
      border-radius: 18px 18px 12px 12px;
      background: linear-gradient(180deg, #818181 0%, #6d6d6d 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .school-folder__front::after{
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      top: 12px;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .school-folder__chips{
      position: absolute;
      left: 12px;
      bottom: 10px;
      display: flex;
      align-items: center;
    }

    .school-folder__chip{
      width: 24px;
      height: 24px;
      margin-left: -7px;
      border-radius: 999px;
      border: 2px solid #676767;
      background: var(--chip-bg, #ffffff);
      color: #111827;
      font-size: 10px;
      font-weight: 800;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 10px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    .school-folder__chip:first-child{

    }

    .school-folder__chip--1{ --chip-bg: #f8fafc; }
    .school-folder__chip--2{ --chip-bg: #e0f2fe; }
    .school-folder__chip--3{ --chip-bg: #dcfce7; }

    .school-folder__name{
