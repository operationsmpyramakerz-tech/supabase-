<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />

<body class="permissions-loading page-lms" data-sidebar-open-scroll="instant">

      <div class="sidebar-header">

        <button aria-expanded="true" aria-label="Toggle sidebar" class="sidebar-toggle" id="sidebar-toggle">
          <i data-feather="chevrons-left"></i>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="LMS pages">
        <ul class="nav-list">
          <li><a class="nav-link" href="/lms/user-access"><i data-feather="users"></i><span class="nav-label">Users Center</span></a></li>
                  <li><a class="nav-link" href="/lms/b2b"><svg class="lms-school-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path d="M4 10.5 12 4l8 6.5"/>
  <path d="M5.5 9.5V20h13V9.5"/>
  <path d="M9.5 20v-5h5v5"/>
  <path d="M8 12h1.5M14.5 12H16"/>
  <circle cx="12" cy="9" r="1.6"/>
  <path d="M12 7.4v1.7l1 .6"/>
  <path d="M12 4V1.8h4l-1 1 1 1h-4"/>
</svg><span class="nav-label">Schools</span></a></li>

        <div class="header-row1">

            <div class="greeting-pill" aria-live="polite">

                <div class="greet-title">Learning Management System</div>
                <div class="greet-sub">Learning workspace</div>
              </div>
            </div>
          </div>
          <div class="right topbar-right">
            <a class="account-mini" href="/account" title="My account" aria-label="My account">
              <span class="ico-circle"><img src="/images/logo.png" alt="Logo" /></span>
              <span class="label">My account</span>
            </a>
          </div>
        </div>
        <div class="header-row2">
          <h1 class="page-title">LMS</h1>
        </div>
      </header>

      <main class="lms-workspace" aria-label="LMS workspace">
        <section class="lms-workspace__canvas" aria-label="Empty LMS workspace"></section>
      </main>
    </div>
  </div>
  <script>if(window.feather)feather.replace();</script>
