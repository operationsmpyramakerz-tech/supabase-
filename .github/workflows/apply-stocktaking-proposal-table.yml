name: Apply Stocktaking Proposal Folders Table

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stocktaking-proposal-table.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Stocktaking patch
        shell: bash
        run: |
          cat .github/stocktaking-patch/part1 .github/stocktaking-patch/part2 .github/stocktaking-patch/part3 .github/stocktaking-patch/part4 .github/stocktaking-patch/part5 | base64 -d > /tmp/stocktaking.patch
          git apply --check /tmp/stocktaking.patch
          git apply /tmp/stocktaking.patch
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/stocktaking-patch .github/workflows/apply-stocktaking-proposal-table.yml
          git add EmptyCanvas/next-frontend/components/stocktaking/StocktakingClient.jsx EmptyCanvas/next-frontend/app/classic-parity.css EmptyCanvas/server/app.js
          git commit -m 'Match Stocktaking folders to Proposal and add receipt table'
          git push origin main
