name: Apply Proposal stock users fix

on:
  push:
    branches: [main]
    paths:
      - '.github/proposal-stock-users-fix.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch ProposalsClient
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('EmptyCanvas/next-frontend/components/proposals/ProposalsClient.jsx')
          text = path.read_text()

          marker = '''function normalizeKitFolder(folder, index = 0) {
            return {
              id: text(folder?.id) || `kit-folder-${index}`,
              name: text(folder?.name) || "Untitled folder",
            };
          }
          '''
          addition = '''
          function normalizeUsersCenterMembers(payload) {
            const direct = Array.isArray(payload?.members) ? payload.members : [];
            const departments = Array.isArray(payload?.departments) ? payload.departments : [];
            const nested = departments.flatMap((department) => Array.isArray(department?.members) ? department.members : []);
            const seen = new Set();
            return [...direct, ...nested]
              .map((member) => {
                const fields = Array.isArray(member?.fields) ? member.fields : [];
                const stockField = fields.find((field) => ["school", "stocktaking column", "done column"].includes(lower(field?.label)));
                return {
                  ...member,
                  id: text(member?.id),
                  name: text(member?.name) || "Unnamed",
                  stocktakingColumn: text(member?.stocktakingColumn || member?.school || stockField?.value),
                };
              })
              .filter((member) => {
                if (!member.id || !member.name || seen.has(member.id)) return false;
                seen.add(member.id);
                return true;
              })
              .sort((a, b) => a.name.localeCompare(b.name));
          }
          '''

          if 'function normalizeUsersCenterMembers(payload)' not in text:
              if marker not in text:
                  raise SystemExit('normalizeKitFolder marker not found')
              text = text.replace(marker, marker + addition, 1)

          replacements = [
            (
              'const [members, setMembers] = useState(() => Array.isArray(initialMembers?.members) ? initialMembers.members : []);',
              'const [members, setMembers] = useState(() => normalizeUsersCenterMembers(initialMembers));'
            ),
            (
              'requestJson(`/api/products/proposals/team-members?_ts=${Date.now()}`),',
              'requestJson(`/api/user-access/team-members?_fresh=1&_ts=${Date.now()}`),'
            ),
            (
              'setMembers(Array.isArray(memberBody.members) ? memberBody.members : []);',
              'setMembers(normalizeUsersCenterMembers(memberBody));'
            ),
            (
              'requestJson(`/api/products/proposals/team-members?_ts=${Date.now()}`)\n      .then((body) => setMembers(Array.isArray(body?.members) ? body.members : []))',
              'requestJson(`/api/user-access/team-members?_fresh=1&_ts=${Date.now()}`)\n      .then((body) => setMembers(normalizeUsersCenterMembers(body)))'
            ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Expected snippet not found: {old[:80]}')

          path.write_text(text)
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- EmptyCanvas/next-frontend/components/proposals/ProposalsClient.jsx; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EmptyCanvas/next-frontend/components/proposals/ProposalsClient.jsx
          git commit -m 'Fix Proposal Stock user list from Users Center'
          git push origin main
