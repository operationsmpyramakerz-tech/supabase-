name: Apply Kits action parity patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/erp-apply-kits-actions.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Kits action patch and clean helper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          base64 -d .erp-patch/kits-actions.patch.gz.b64 | gunzip > /tmp/kits-actions.patch
          git apply --check /tmp/kits-actions.patch
          git apply /tmp/kits-actions.patch
          rm -f .erp-patch/kits-actions.patch.gz.b64 .github/workflows/erp-apply-kits-actions.yml
          rmdir .erp-patch 2>/dev/null || true
          git add -A
          git commit -m "Add proposal actions to kits"
          git push origin HEAD:main
