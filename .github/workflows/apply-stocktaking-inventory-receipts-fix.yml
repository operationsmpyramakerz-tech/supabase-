name: Apply Stocktaking inventory receipts fix

on:
  push:
    branches: [main]
    paths:
      - '.github/stocktaking-inventory-receipts-fix.trigger'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/stockfix.part1 .github/patches/stockfix.part2 .github/patches/stockfix.part3 > /tmp/stockfix.patch.gz.b64
          base64 -d /tmp/stockfix.patch.gz.b64 > /tmp/stockfix.patch.gz
          gzip -dc /tmp/stockfix.patch.gz > /tmp/stockfix.patch
          git apply --check /tmp/stockfix.patch
          git apply /tmp/stockfix.patch

      - name: Commit code and clean helper files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/stocktaking-inventory-receipts-fix.trigger
          rm -f .github/patches/stockfix.part1 .github/patches/stockfix.part2 .github/patches/stockfix.part3
          rm -f .github/workflows/apply-stocktaking-inventory-receipts-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enhance Stocktaking inventory and receipt flow"
          git push origin HEAD:main
